name: Osvezi trke
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/scrape.py
      - name: Sacuvaj ako ima promena
        run: |
          git config user.name "trke-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trke.json
          git diff --staged --quiet || (git commit -m "Osvezeni podaci" && git push)
